replicaCount: 1

container: 
  image:
    repository: armdocker.rnd.ericsson.se/proj-santi-genai/python-processor
    pullPolicy: Always
    port: 5000

configuration:
  environment: production
  logLevel: info

imagePullSecrets: []
#nameOverride: ""
#fullnameOverride: ""

probes: 
  readiness:
    path: /readyz
    successThreshold: 1
    failureThreshold: 3
    periodSeconds: 15
    initialDelaySeconds: 10
  liveness:
    path: /healthz
    successThreshold: 1
    failureThreshold: 3
    periodSeconds: 15
    initialDelaySeconds: 15

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""


podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: 
  limits:
    cpu: 400m
    memory: 328Mi
  requests:
    cpu: 100m
    memory: 128Mi


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - python-processor
        topologyKey: "kubernetes.io/hostname"
