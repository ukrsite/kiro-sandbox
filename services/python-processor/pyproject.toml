[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-processor"
version = "0.1.0"
description = "python-processor"
authors = [
  { name = "name", email = "email" }
]
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov",
  "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
